[package]
name = "mrc-core"
version.workspace = true
edition.workspace = true
description = "会议记录核心库:采集/转写/说话人/后处理/会议包"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
ureq.workspace = true
chrono.workspace = true
hound.workspace = true
toml.workspace = true
base64.workspace = true
cpal = "0.15"
md5 = "0.7"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# 本地 STT:SenseVoice(sherpa-onnx;download-binaries 自动取预编译二进制)
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }

# WASAPI 环回采集(Teams 等会议软件的远端声音走系统输出,环回抓取)
wasapi = "0.27"

# 会议纪要 minutes.md 里内嵌截图(png 解码 → 缩图 → webp → base64)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
