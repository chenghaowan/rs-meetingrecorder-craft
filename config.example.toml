# ltl-meetingrecordCraft 配置(%APPDATA%\ltl-meetingrecord\config.toml)
# 全部字段都有默认值;最小可用只需填 [llm].api_key


[stt]
# 本地 SenseVoice(sherpa-rs 进程内 ONNX,zh/en/ja/ko/yue,带标点)—— 唯一 STT 引擎
# 模型缺失时: mrc-recorder --fetch-models 或开会自动下载(约 230 MB,经 hf-mirror)
provider = "sensevoice"  # "sensevoice" | "none"(只录音归档)
model_dir = ""           # 模型目录(需 model.int8.onnx + tokens.txt);留空自动找 data_dir\models\sensevoice
language = "auto"        # auto / zh / en / ja / ko / yue
num_threads = 2          # ONNX 推理线程数
window_secs = 12.0       # 流式解码窗口(无 VAD 回退模式用;有 silero-vad 时忽略)

# ── 采集(现场麦克风 + 环回远端声)──
[capture]
mic_enabled = true       # 采集现场麦克风
loopback_enabled = true  # 环回采集系统输出声(Teams 等会议软件的远端声音)
loopback_device = ""     # 输出设备友好名子串;留空 = 默认输出设备

[diarize]
# 说话人分离全本地 ONNX(pyannote-segmentation + CAM++ 声纹,模型自动下载约 34 MB)
enabled = true           # 失败自动跳过(名字全靠手动命名)
threshold = 0.5          # 聚类阈值(簇数未知走阈值模式;越小簇越少)
cross_match = 0.4        # 跨流(mic/remote)簇质心合并的余弦阈值

[llm]
# OpenAI 兼容端点(dashscope / deepseek / ollama / vllm 均可)
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = ""             # 必填才能出 LLM 总结
model = "qwen-long"      # 长上下文模型优先(15万字转写要 >=128k 上下文)
temperature = 0.2
timeout_secs = 300
context_tokens = 200000  # 超过 0.8 倍自动降级为两段总结+合并
json_schema = true       # 端点不支持 json_schema 时改 false
max_retries = 3

[shots]
# pointtofixcraft 的截图库;留空用默认 %APPDATA%\pointtofix\gallery.db
db_path = ""
root = ""
context_window_secs = 30.0   # 截图时刻 ±N 秒的发言作为 context
default_window = ""          # 指定窗口截图:窗口标题关键词(如 "飞书");面板📷/CLI/自动截图共用
auto_window_secs = 0         # 会议中自动截该窗口的间隔秒;0=关闭

[rag]
# ym3dRagCraft 的 /ingest 基址;留空跳过入库
base_url = ""
timeout_secs = 60

[post]
chunk_window_secs = 300.0    # chunk 时间窗
chunk_token_limit = 1000     # chunk token 上限(近似)
voiceprint_match = 0.65      # >=此值自动预填名
voiceprint_uncertain = 0.55  # [此值,match) 标疑似
voiceprint_max_samples = 10  # 每人保留声纹样本数

# ── GUI(recorder)──
# 主悬浮面板置顶
main_on_top = true

[subtitle]
enabled = true           # 录音中显示屏幕底部字幕条
always_on_top = true     # 字幕窗口置顶
font_size = 26.0         # 字号(逻辑像素)
opacity = 0.55           # 背景不透明度 0~1
bottom_margin = 48.0     # 距屏幕底部边距

[tools]
# pointtofixcraft(截图工具)获取来源:http(s) .exe 直链,或本地便携 exe/目录;
# 留空 = 自动找兄弟仓库 …\pointtofixcraft\dist\pointtofix-portable
pointtofix_url = ""
# 已安装位置覆盖;留空 = %APPDATA%\ltl-meetingrecord	ools\pointtofix\pointtofix.exe
pointtofix_exe = ""

[translate]
# 字幕实时翻译: "local"(llama-server + Hy-MT3,本机 GPU,离线,自动拉起 127.0.0.1:17810)
#             | "llm"(复用 [llm] 端点,编号批量,术语更准) | "baidu" | "none"
provider = "none"
from_lang = "zh"
to_lang = "en"
batch_size = 4              # llm provider 每次调用翻译的段数
# baidu 凭据(与 ltl-manage .env 同一套)
appid = ""
secret = ""
api_url = "https://fanyi-api.baidu.com/api/trans/vip/translate"

[translate.local]
# llama-server(b12716 Vulkan 预编译包)+ Hy-MT3 GGUF;留空自动发现:
#   exe: data_dir\tools\llama-vulkan\llama-server.exe
#   模型: data_dir\models\hy-mt3\*.gguf
server_exe = ""
model_path = ""
port = 17810
ngl = 99                    # GPU 卸载层数(99=全部进显存)
ctx = 4096
